server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/abacachat_audit}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}

app:
  rabbitmq:
    exchange: ${APP_RABBITMQ_EXCHANGE:audit.exchange}
    queue: ${APP_RABBITMQ_QUEUE:audit.logs.queue}
    routing-key: ${APP_RABBITMQ_ROUTING_KEY:audit.#}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
